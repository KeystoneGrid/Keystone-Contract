name: Bug
description: Report a reproducible bug
title: "[Bug]: "
labels:

* bug
  body:

* type: textarea
  id: description
  attributes:
  label: Description
  description: Clearly describe the problem.
  validations:
  required: true

* type: textarea
  id: reproduction
  attributes:
  label: Steps to Reproduce
  description: Provide the smallest reliable reproduction.
  validations:
  required: true

* type: textarea
  id: expected
  attributes:
  label: Expected Behavior
  validations:
  required: true

* type: textarea
  id: actual
  attributes:
  label: Actual Behavior
  validations:
  required: true

* type: input
  id: version
  attributes:
  label: Version / Commit

* type: textarea
  id: environment
  attributes:
  label: Environment
  description: Include relevant OS, runtime, browser, network, or tooling information.

* type: textarea
  id: security
  attributes:
  label: Security Impact
  description: Does this issue affect authorization, funds, ownership, privacy, or protocol integrity?
