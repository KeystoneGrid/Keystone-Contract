name: Documentation
description: Improve or add project documentation
title: "[Docs]: "
labels:

* documentation
  body:

* type: textarea
  id: problem
  attributes:
  label: Documentation Problem
  description: What is missing, unclear, outdated, or incorrect?
  validations:
  required: true

* type: textarea
  id: location
  attributes:
  label: Relevant Location
  description: Identify the file, section, repository, RFC, or documentation page.

* type: textarea
  id: proposal
  attributes:
  label: Proposed Improvement
  description: Describe the documentation change.
  validations:
  required: true
