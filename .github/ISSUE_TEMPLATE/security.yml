name: Security
description: Report a security concern that is appropriate for public discussion
title: "[Security]: "
labels:

* security
  body:

* type: markdown
  attributes:
  value: |
  Do not use this template for vulnerabilities that could expose users, funds, private information, credentials, or exploitable protocol weaknesses.

  ```
  Sensitive vulnerabilities should be reported privately according to SECURITY.md.
  ```

* type: textarea
  id: concern
  attributes:
  label: Security Concern
  description: Describe the security concern without including sensitive exploit details.
  validations:
  required: true

* type: textarea
  id: impact
  attributes:
  label: Potential Impact

* type: textarea
  id: mitigation
  attributes:
  label: Suggested Mitigation
